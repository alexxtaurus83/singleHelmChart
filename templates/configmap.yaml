{{- with .Values.environmentVariablesViaConfigMap }}
  {{- if .enabled }}
apiVersion: v1
kind: ConfigMap 
metadata:
  name: {{ $.Values.applicationName }}-configmap
  labels:
    app: {{ $.Values.applicationName }}
data:
{{- range $key, $value := .list }}
  {{ tpl $key $ }} : {{ tpl $value $ }} 
{{- end }}
  {{- end }}
{{- end }}
